<script>
// ====== 数据模型 ======
const STORAGE_KEY = 'script_memorization_data';

// ====== 版本信息 ======
const APP_VERSION = '1.3.0';
const VERSION_DATE = '2026-09-15';

const CHANGELOG = [
  {
    version: '1.3.0',
    date: '2026-09-15',
    changes: [

      '优化：历史记录支持多语言，复习系统按语言分别管理'
    ]
  },
  {
    version: '1.2.0',
    date: '2026-09-15',
    changes: [
      '新增：单词点击变形解析功能（词干+词尾拆解+变形说明）',
      '新增：版本号管理与更新日志',
      '新增：在线检测新版本，一键更新',
      '优化：Service Worker 缓存策略升级为网络优先'
    ]
  },
  {
    version: '1.1.0',
    date: '2026-09-12',
    changes: [
      '新增：PWA 支持（可安装到手机主屏幕）',
      '新增：离线缓存 Service Worker',
      '新增：App 图标（192px / 512px）',
      '新增：manifest.json 配置文件'
    ]
  },
  {
    version: '1.0.0',
    date: '2026-09-09',
    changes: [
      '初始版本',
      '每日句子推送（1-3 句可选）',
      '点击单词弹释义 + 音频播放',
      '间隔复习系统（1-3-7-14-30 天）',
      '历史记录 + 句子详情页',
      '导入/导出学习数据',
      '默写自测模块'
    ]
  }
];

// 句子数据（从 data.json 动态加载，失败时回退到本地缓存）
let sentenceData = null;
const SENTENCE_DATA_CACHE_KEY = 'script_memorization_sentence_data';

// 各语言元信息（flag + 名称），data.json 加载后会用其中数据覆盖
const LANGUAGE_META = {
  ko: { name: '韩语', flag: '🇰🇷' },
  ja: { name: '日语', flag: '🇯🇵' },
  en: { name: '英语', flag: '🇬🇧' }
};

// 异步加载句子库：fetch data.json，失败回退到 localStorage 缓存
async function loadData() {
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    sentenceData = await res.json();
    // 同步语言元信息
    if (sentenceData && sentenceData.languages) {
      for (const code in sentenceData.languages) {
        const lang = sentenceData.languages[code];
        if (lang.name) LANGUAGE_META[code] = { name: lang.name, flag: lang.flag || (LANGUAGE_META[code] ? LANGUAGE_META[code].flag : '🌐') };
        else if (!LANGUAGE_META[code]) LANGUAGE_META[code] = { name: code, flag: '🌐' };
      }
    }
    // 写入本地缓存
    try { localStorage.setItem(SENTENCE_DATA_CACHE_KEY, JSON.stringify(sentenceData)); } catch(e) {}
  } catch(e) {
    console.error('加载 data.json 失败，尝试本地缓存', e);
    try {
      const cached = localStorage.getItem(SENTENCE_DATA_CACHE_KEY);
      if (cached) {
        sentenceData = JSON.parse(cached);
        if (sentenceData && sentenceData.languages) {
          for (const code in sentenceData.languages) {
            const lang = sentenceData.languages[code];
            if (lang.name) LANGUAGE_META[code] = { name: lang.name, flag: lang.flag || (LANGUAGE_META[code] ? LANGUAGE_META[code].flag : '🌐') };
            else if (!LANGUAGE_META[code]) LANGUAGE_META[code] = { name: code, flag: '🌐' };
          }
        }
      }
    } catch(e2) {
      console.error('本地缓存也不可用', e2);
      sentenceData = null;
    }
  }
}

// 获取某语言的扁平句子队列（按 sources -> episodes 顺序展开），并为每个句子标注 language
function getSentenceQueue(language) {
  if (!sentenceData || !sentenceData.languages || !sentenceData.languages[language]) return [];
  const lang = sentenceData.languages[language];
  const queue = [];
  if (lang.sources) {
    lang.sources.forEach(src => {
      if (src.episodes) {
        src.episodes.forEach(ep => {
          if (ep.sentences) {
            ep.sentences.forEach(s => {
              queue.push(Object.assign({}, s, {
                language: language,
                drama: s.drama || src.title || '',
                episode: s.episode != null ? s.episode : (ep.episode != null ? ep.episode : '')
              }));
            });
          }
        });
      }
    });
  }
  return queue;
}

// 跨语言根据 id 查找句子
function getSentenceById(id) {
  if (!sentenceData || !sentenceData.languages) return null;
  for (const code in sentenceData.languages) {
    const queue = getSentenceQueue(code);
    const found = queue.find(s => s.id === id);
    if (found) return found;
  }
  return null;
}

// 获取某语言的元信息（name + flag）
function getLanguageMeta(code) {
  return LANGUAGE_META[code] || { name: code, flag: '🌐' };
}

// 间隔复习周期（天）
const REVIEW_SCHEDULE = [1, 3, 7, 14, 30];

// ====== 数据管理 ======
let state = {
  settings: {
    dailyCount: 2,
    speed: 'normal',
    language: 'ko',         // 当前学习语言
    startDate: '',          // 学习开始日期 YYYY-MM-DD
    pushTime: '08:00'       // 每日推送时间 HH:MM
  },
  sentences: {}, // id -> { addedDate, stage, nextReview, reviewLog, status, language }
  libraryIndex: 0 // 兼容旧数据，新版本按日期计算
};

// 确保旧数据包含新增的设置字段（向上兼容）
function migrateState() {
  if (!state.settings) state.settings = {};
  if (state.settings.language == null) state.settings.language = 'ko';
  if (!state.settings.startDate) state.settings.startDate = getTodayStr();
  if (!state.settings.pushTime) state.settings.pushTime = '08:00';
  if (state.settings.dailyCount == null) state.settings.dailyCount = 2;
  if (!state.settings.speed) state.settings.speed = 'normal';
  if (state.libraryIndex == null) state.libraryIndex = 0;
  // 为旧的句子记录补充 language 字段（默认 ko）
  for (const id in state.sentences) {
    if (!state.sentences[id].language) state.sentences[id].language = 'ko';
  }
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      state = JSON.parse(saved);
    }
    migrateState();
  } catch(e) {
    console.error('加载数据失败', e);
    migrateState();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {
    console.error('保存数据失败', e);
  }
}

// ====== 工具函数 ======
function formatDate(date) {
  const d = new Date(date);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function formatDateShort(date) {
  const d = new Date(date);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function isTodayOrBefore(dateStr) {
  return dateStr <= getTodayStr();
}

// 计算两个日期字符串之间的天数差（endDate - startDate，按自然日）
function daysBetween(startDateStr, endDateStr) {
  const start = new Date(startDateStr + 'T00:00:00');
  const end = new Date(endDateStr + 'T00:00:00');
  return Math.round((end - start) / 86400000);
}

// 判断当前时间是否还未到今日推送时间
function isBeforePushTime() {
  const pushTime = state.settings.pushTime || '08:00';
  const now = new Date();
  const [ph, pm] = pushTime.split(':').map(Number);
  const push = new Date(now);
  push.setHours(ph || 0, pm || 0, 0, 0);
  return now < push;
}

// 计算距今日推送时间的倒计时文本（HH:MM）
function getPushTimeCountdown() {
  const pushTime = state.settings.pushTime || '08:00';
  const now = new Date();
  const [ph, pm] = pushTime.split(':').map(Number);
  const push = new Date(now);
  push.setHours(ph || 0, pm || 0, 0, 0);
  let diff = push - now;
  if (diff < 0) diff = 0;
  const totalMin = Math.floor(diff / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

// 根据语言和日期计算今日应学的新句子
// 今日句子 = 从对应语言队列中，按 [已过天数 * 每日数量] 开始取 [每日数量] 个
function getTodaySentences() {
  const language = state.settings.language || 'ko';
  const count = parseInt(state.settings.dailyCount) || 2;
  const startDate = state.settings.startDate || getTodayStr();
  const today = getTodayStr();

  let daysPassed = daysBetween(startDate, today);
  // 未到推送时间时，仍显示前一天的内容
  if (isBeforePushTime()) daysPassed -= 1;
  if (daysPassed < 0) daysPassed = 0;

  const startIdx = daysPassed * count;
  const queue = getSentenceQueue(language);
  return queue.slice(startIdx, startIdx + count);
}

// 获取今日新句子（兼容旧调用名，基于日期计算）
function getTodayNewSentences() {
  return getTodaySentences();
}

// 获取今日复习句子（按当前语言筛选）
function getTodayReviewSentences() {
  const today = getTodayStr();
  const language = state.settings.language || 'ko';
  const result = [];
  for (const id in state.sentences) {
    const s = state.sentences[id];
    if (s.status === 'mastered') continue;
    // 只复习当前语言的句子
    if (s.language && s.language !== language) continue;
    if (s.nextReview && isTodayOrBefore(s.nextReview)) {
      const libSent = getSentenceById(id);
      if (libSent) result.push(libSent);
    }
  }
  return result;
}

// 标记句子为已学习
function markAsLearned(sentenceId) {
  const today = getTodayStr();
  const language = state.settings.language || 'ko';
  if (!state.sentences[sentenceId]) {
    state.sentences[sentenceId] = {
      addedDate: today,
      stage: 0,
      nextReview: addDays(today, REVIEW_SCHEDULE[0]),
      reviewLog: [{ date: today, result: 'learned' }],
      status: 'reviewing',
      language: language
    };
    saveState();
  }
}

// 复习结果
function recordReview(sentenceId, correct) {
  const s = state.sentences[sentenceId];
  if (!s) return;
  const today = getTodayStr();

  s.reviewLog.push({ date: today, result: correct ? 'correct' : 'wrong' });

  if (correct) {
    s.stage++;
    if (s.stage >= REVIEW_SCHEDULE.length) {
      s.status = 'mastered';
      s.nextReview = null;
    } else {
      s.nextReview = addDays(today, REVIEW_SCHEDULE[s.stage]);
      s.status = 'reviewing';
    }
  } else {
    s.stage = 0;
    s.nextReview = addDays(today, REVIEW_SCHEDULE[0]);
    s.status = 'reviewing';
  }

  saveState();
}

// 统计数据
function getStats() {
  let total = 0, reviewing = 0, mastered = 0;
  for (const id in state.sentences) {
    total++;
    if (state.sentences[id].status === 'mastered') mastered++;
    else reviewing++;
  }
  return { total, reviewing, mastered };
}

// ====== 音频播放 ======
const audio = document.getElementById('audioPlayer');
let currentAudioBtn = null;

function playAudio(src, btn) {
  if (!src) return;

  if (currentAudioBtn === btn && !audio.paused) {
    audio.pause();
    audio.currentTime = 0;
    setBtnPlaying(btn, false);
    currentAudioBtn = null;
    return;
  }

  if (currentAudioBtn) setBtnPlaying(currentAudioBtn, false);

  audio.src = src;
  audio.play().then(() => {
    setBtnPlaying(btn, true);
    currentAudioBtn = btn;
  }).catch(err => {
    console.error('播放失败', err);
  });
}

function setBtnPlaying(btn, playing) {
  if (!btn) return;
  const span = btn.querySelector('span');
  const svg = btn.querySelector('svg');
  if (playing) {
    btn.classList.add('is-playing');
    if (span) { btn._origText = span.textContent; span.textContent = '停止'; }
    if (svg) { btn._origSvg = svg.innerHTML; svg.innerHTML = '<rect x="6" y="6" width="12" height="12"/>'; }
  } else {
    btn.classList.remove('is-playing');
    if (span && btn._origText) span.textContent = btn._origText;
    if (svg && btn._origSvg) svg.innerHTML = btn._origSvg;
  }
}

function renderSentenceCard(sent, type, index, language) {
  const lang = language || sent.language || state.settings.language || 'ko';
  const meta = getLanguageMeta(lang);
  const tagClass = type === 'new' ? 'tag-new' : 'tag-review';
  const tagText = type === 'new' ? '新句子' : '复习';
  const isLearned = state.sentences[sent.id];

  // 根据语言构建发音显示
  // 韩语：pronunciation（实际发音）+ soundChange（音变说明）
  // 日语：pronunciation（振假名）+ romaji（罗马字）
  // 英语：pronunciation（IPA音标）
  let pronunHtml = '';
  if (sent.pronunciation) {
    pronunHtml += `<div class="pronunciation">${sent.pronunciation}</div>`;
  }
  if (lang === 'ko' && sent.soundChange) {
    pronunHtml += `<div class="pronunciation" style="margin-top:2px; font-size:11px;">音变：${sent.soundChange}</div>`;
  } else if (lang === 'ja' && sent.romaji) {
    pronunHtml += `<div class="pronunciation" style="margin-top:2px; font-size:11px;">ローマ字：${sent.romaji}</div>`;
  }

  let wordsHtml = '';
  sent.words.forEach((w, i) => {
    const morphStr = w.morph ? JSON.stringify(w.morph) : '';
    wordsHtml += `<span class="word-chip"
      data-word="${w.word}" data-pronun="${w.pronun || ''}" data-pos="${w.pos || ''}"
      data-meaning="${w.meaning || ''}" data-ex-kr="${w.exKr || ''}" data-ex-cn="${w.exCn || ''}"
      data-audio="${w.audio || ''}" data-morph="${encodeURIComponent(morphStr)}">${w.text}</span>`;
    if (i < sent.words.length - 1) wordsHtml += ' ';
  });

  let actionHtml = '';
  if (type === 'new') {
    actionHtml = `<div class="memorize-actions">
      <span class="mem-label">学完了吗？</span>
      <button class="btn btn-success" onclick="handleLearned('${sent.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span>已背会</span>
      </button>
    </div>`;
  } else {
    actionHtml = `<div class="memorize-actions">
      <span class="mem-label">记住了吗？</span>
      <button class="btn btn-success" onclick="handleReview('${sent.id}', true)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span>记住了</span>
      </button>
      <button class="btn btn-secondary" onclick="handleReview('${sent.id}', false)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>没记住</span>
      </button>
    </div>`;
  }

  return `<div class="sentence-card" data-id="${sent.id}">
    <div class="card-header">
      <span class="card-tag ${tagClass}">${tagText}</span>
      <span class="lang-tag"><span class="lang-flag">${meta.flag}</span>${meta.name}</span>
      <span class="card-meta" style="margin-left:auto;">${sent.drama}${sent.episode != null ? ' · EP' + sent.episode : ''}</span>
    </div>
    <div class="sentence-text">${wordsHtml}</div>
    ${pronunHtml}
    <div class="translation">${sent.translation}</div>
    <div class="play-bar">
      ${sent.audioFull ? `<button class="btn btn-primary" data-audio="${sent.audioFull}" onclick="playAudio('${sent.audioFull}', this)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span>播放</span>
      </button>` : ''}
      ${sent.audioSlow ? `<button class="btn btn-secondary" data-audio="${sent.audioSlow}" onclick="playAudio('${sent.audioSlow}', this)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 8v8l6-4-6-4zm6.5-1l1.5-1.5v11L16.5 15v-8zM6.5 7L8 5.5v13L6.5 17v-10z"/></svg>
        <span>慢速</span>
      </button>` : ''}
    </div>
    <div class="word-detail">
      <div class="detail-top">
        <span class="detail-word">—</span>
        <span class="detail-pronun"></span>
        <span class="detail-pos"></span>
        <button class="btn btn-secondary detail-word-play-btn" style="margin-left:auto; padding:4px 10px; font-size:11px;">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          听发音
        </button>
      </div>
      <div class="detail-meaning"></div>
      <div class="detail-morph" style="display:none;">
        <div class="detail-morph-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-6M6 20v-4M18 20v-8M2 12l10-8 10 8"/></svg>
          变形解析
        </div>
        <div class="morph-flow"></div>
        <div class="morph-explain"></div>
      </div>
      <div>
        <div style="font-size:11px; color:var(--text-muted); margin-bottom:2px;">例句</div>
        <div class="detail-ex-kr"></div>
        <div class="detail-ex-cn"></div>

    ${actionHtml}
  </div>`;

function bindCardEvents() {
  document.querySelectorAll('.sentence-card').forEach(card => {
    const chips = card.querySelectorAll('.word-chip');
    const detail = card.querySelector('.word-detail');
    const detailWord = detail.querySelector('.detail-word');
    const detailPronun = detail.querySelector('.detail-pronun');
    const detailPos = detail.querySelector('.detail-pos');
    const detailMeaning = detail.querySelector('.detail-meaning');
    const morphBox = detail.querySelector('.detail-morph');
    const morphFlow = detail.querySelector('.morph-flow');
    const morphExplain = detail.querySelector('.morph-explain');
    const exKr = detail.querySelector('.detail-ex-kr');
    const exCn = detail.querySelector('.detail-ex-cn');
    const playWordBtn = detail.querySelector('.detail-word-play-btn');
    let activeAudio = null;

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const wasActive = chip.classList.contains('is-active');
        chips.forEach(c => c.classList.remove('is-active'));

        if (wasActive) {
          detail.classList.remove('is-visible');
          activeAudio = null;
        } else {
          chip.classList.add('is-active');
          detailWord.textContent = chip.dataset.word;
          detailPronun.textContent = chip.dataset.pronun;
          detailPos.textContent = chip.dataset.pos;
          detailMeaning.textContent = chip.dataset.meaning;
          exKr.textContent = chip.dataset.exKr;
          exCn.textContent = chip.dataset.exCn;
          activeAudio = chip.dataset.audio;

          // 变形解析
          const morphStr = chip.dataset.morph ? decodeURIComponent(chip.dataset.morph) : '';
          if (morphStr) {
            try {
              const morph = JSON.parse(morphStr);
              // 构建变形流程图: 基本形 → 部分1 + 部分2 + ... → 结果
              let flowHtml = `<span class="morph-base">${morph.base}</span>`;
              flowHtml += `<span class="morph-arrow">→</span>`;
              morph.parts.forEach((p, i) => {
                if (i > 0) flowHtml += ` <span style="color:var(--text-tertiary); font-size:11px;">+</span> `;
                flowHtml += `<span class="morph-suffix" title="${p.type}">${p.text}</span>`;
              });
              flowHtml += `<span class="morph-arrow">→</span>`;
              flowHtml += `<span class="morph-result">${morph.result}</span>`;
              morphFlow.innerHTML = flowHtml;
              morphExplain.textContent = morph.explain;
              morphBox.style.display = 'block';
            } catch(e) {
              morphBox.style.display = 'none';
            }
          } else {
            morphBox.style.display = 'none';
          }

          detail.classList.add('is-visible');
          playWordBtn.style.display = activeAudio ? 'inline-flex' : 'none';
        }
      });
    });

    playWordBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeAudio) playAudio(activeAudio, playWordBtn);
    });
  });
}

function renderHistory() {
  const container = document.getElementById('historyList');

  for (const id in state.sentences) {

    const lib = getSentenceById(id);
    if (lib) {
      entries.push({ ...s, id, text: lib.text, drama: lib.drama, language: s.language || lib.language || 'ko' });
    }
  }

  // 按添加时间倒序
  entries.sort((a, b) => b.addedDate.localeCompare(a.addedDate));

  if (entries.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📚</div>

function showDetail(id) {

  const lang = s.language || lib.language || 'ko';
  const meta = getLanguageMeta(lang);
  const container = document.getElementById('detailContent');

  // 构建发音信息
  let pronunDetail = '';
  if (lib.pronunciation) {
    pronunDetail += `<p style="color:var(--text-muted); font-size:13px;">发音：${lib.pronunciation}</p>`;
  }
  if (lang === 'ko' && lib.soundChange) {
    pronunDetail += `<p style="color:var(--text-tertiary); font-size:12px;">音变：${lib.soundChange}</p>`;
  } else if (lang === 'ja' && lib.romaji) {
    pronunDetail += `<p style="color:var(--text-tertiary); font-size:12px;">ローマ字：${lib.romaji}</p>`;
  }

  let logHtml = '';
  s.reviewLog.forEach(log => {
    let resultClass, resultText;

  let statusText, progressPct;

  } else {
    statusText = `复习中 · 第 ${s.stage + 1} / ${REVIEW_SCHEDULE.length} 轮`;
    progressPct = (s.stage / REVIEW_SCHEDULE.length) * 100;

  let nextReviewText = s.nextReview ? formatDate(s.nextReview) : '—';

  container.innerHTML = `
    <div class="detail-section">

    <div class="detail-section">
      <h3>学习进度</h3>
      <p style="font-size:14px; margin-bottom:4px;">${statusText}</p>
      <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <p style="font-size:12px; color:var(--text-muted); margin-top:8px;">

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.sentences && data.settings) {
        state = data;
        migrateState();
        saveState();
        // 恢复设置UI
        document.getElementById('settingDailyCount').value = state.settings.dailyCount;
        document.getElementById('settingSpeed').value = state.settings.speed;
        document.getElementById('settingLanguage').value = state.settings.language || 'ko';

      alert('导入失败：' + err.message);

  reader.readAsText(file);
  event.target.value = '';
}

// ====== 版本与更新管理 ======
let latestVersion = null;
let lastCheckTime = null;

function compareVersions(v1, v2) {
  const a = v1.split('.').map(Number);
  const b = v2.split('.').map(Number);
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const va = a[i] || 0;
    const vb = b[i] || 0;
    if (va > vb) return 1;
    if (va < vb) return -1;
  }
  return 0;
}

async function checkUpdate(manual) {
  // 本地文件模式无法检查更新
  if (location.protocol === 'file:') {
    if (manual) alert('本地文件模式不支持在线检查更新。\n\n请将 App 部署到网上后使用此功能。');
    document.getElementById('latestVersion').textContent = '本地模式不支持';
    return;
  }

  if (manual) {
    const btn = event.currentTarget;
    if (btn) { btn.disabled = true; }
  }

  try {
    // 加时间戳防止缓存
    const res = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('无法获取版本信息');
    const data = await res.json();
    latestVersion = data.version;
    lastCheckTime = Date.now();

    document.getElementById('latestVersion').textContent = 'v' + latestVersion;

    if (compareVersions(latestVersion, APP_VERSION) > 0) {
      // 有新版本
      const banner = document.getElementById('updateBanner');
      document.getElementById('updateVerNum').textContent = 'v' + latestVersion;
      document.getElementById('updateDesc').textContent = data.desc || '';
      banner.classList.add('is-visible');

      if (manual) {
        showConfirm('发现新版本', `v${APP_VERSION} → v${latestVersion}\n\n${data.desc || ''}`, () => {
          applyUpdate();
        });
      }
    } else {
      if (manual) {
        alert('当前已是最新版本 v' + APP_VERSION);
      }
    }
  } catch(err) {
    console.error('检查更新失败:', err);
    document.getElementById('latestVersion').textContent = '检查失败';
    if (manual) alert('检查更新失败：' + err.message + '\n\n可能原因：\n1. 网络连接问题\n2. version.json 文件不存在\n3. 本地文件模式不支持');
  } finally {
    if (manual) {
      const btn = document.target;
      if (btn) { btn.disabled = false; }
    }
  }
}

function applyUpdate() {
  // 注销旧 Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(reg => reg.unregister());
    });
  }
  // 清空所有缓存
  if ('caches' in window) {
    caches.keys().then(keys => {
      keys.forEach(key => caches.delete(key));
    });
  }
  // 强制刷新页面（绕过缓存）
  setTimeout(() => {
    location.reload();
  }, 300);
}

function showChangelog() {
  const container = document.getElementById('changelogContent');
  let html = '';
  CHANGELOG.forEach((entry, i) => {
    const isCurrent = entry.version === APP_VERSION;
    const isLatest = entry.version === latestVersion;
    let badge = '';
    if (isCurrent) badge = '<span class="ver-badge current">当前</span>';
    else if (isLatest) badge = '<span class="ver-badge latest">最新</span>';

    html += `<div class="changelog-item">
      <div class="changelog-ver">v${entry.version} ${badge}</div>
      <div class="changelog-date">${entry.date}</div>
      <ul class="changelog-list">
        ${entry.changes.map(c => `<li>${c}</li>`).join('')}
      </ul>
    </div>`;
  });
  container.innerHTML = html;
  document.getElementById('changelogModal').classList.add('is-visible');
}

function closeChangelog() {
  document.getElementById('changelogModal').classList.remove('is-visible');
}

// ====== 初始化 ======
loadState();

// 恢复设置UI
document.getElementById('settingDailyCount').value = state.settings.dailyCount;
document.getElementById('settingSpeed').value = state.settings.speed;
document.getElementById('settingLanguage').value = state.settings.language || 'ko';
document.getElementById('settingStartDate').value = state.settings.startDate || getTodayStr();
document.getElementById('settingPushTime').value = state.settings.pushTime || '08:00';

// 显示当前版本
document.getElementById('currentVersion').textContent = 'v' + APP_VERSION;

// 异步加载句子库后渲染今日页面
(async function init() {
  await loadData();
  renderToday();
})();

// 启动时自动检查更新（仅在线部署时）
if (location.protocol !== 'file:') {
  // 延迟2秒检查，避免影响首屏加载
  setTimeout(() => checkUpdate(false), 2000);
}

// ====== PWA: Service Worker 注册 ======
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('Service Worker 注册成功:', reg.scope);

      // 监听 Service Worker 更新
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // 有新的 Service Worker 等待激活
            console.log('新版本已下载，刷新页面以更新');
          }
        });
      });
    }).catch(err => {
      console.log('Service Worker 注册失败（本地文件打开时正常）:', err);
    });
  });
}
