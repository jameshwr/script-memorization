<!-- 顶部栏 -->
<div class="top-bar">
  <div class="top-title" id="topTitle">今日背诵</div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>

  </div>
</div>

      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">累计学习</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statReview">0</div>
      <div class="stat-label">复习中</div>
    </div>
    <div class="stat-card">

</div>

// 间隔复习周期（天）
const REVIEW_SCHEDULE = [1, 3, 7, 14, 30];

// ====== 数据管理 ======
let state = {
  settings: {
    dailyCount: 2,
    speed: 'normal'
  },
  sentences: {}, // id -> { addedDate, stage, nextReview, reviewLog, status }
  libraryIndex: 0 // 下一个要学的句子索引
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      state = JSON.parse(saved);
    }
  } catch(e) {
    console.error('加载数据失败', e);
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {
    console.error('保存数据失败', e);
  }
}

// ====== 工具函数 ======
function formatDate(date) {
  const d = new Date(date);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function formatDateShort(date) {
  const d = new Date(date);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function isTodayOrBefore(dateStr) {
  return dateStr <= getTodayStr();
}

// 获取今日新句子
function getTodayNewSentences() {
  const count = parseInt(state.settings.dailyCount);
  const result = [];
  let idx = state.libraryIndex;
  while (result.length < count && idx < SENTENCE_LIBRARY.length) {
    const sent = SENTENCE_LIBRARY[idx];
    if (!state.sentences[sent.id]) {
      result.push(sent);
    }
    idx++;
  }
  return result;
}

// 获取今日复习句子
function getTodayReviewSentences() {
  const today = getTodayStr();
  const result = [];
  for (const id in state.sentences) {
    const s = state.sentences[id];
    if (s.status === 'mastered') continue;
    if (s.nextReview && isTodayOrBefore(s.nextReview)) {
      const libSent = SENTENCE_LIBRARY.find(x => x.id === id);
      if (libSent) result.push(libSent);
    }
  }
  return result;
}

// 标记句子为已学习
function markAsLearned(sentenceId) {
  const today = getTodayStr();
  if (!state.sentences[sentenceId]) {
    state.sentences[sentenceId] = {
      addedDate: today,
      stage: 0,
      nextReview: addDays(today, REVIEW_SCHEDULE[0]),
      reviewLog: [{ date: today, result: 'learned' }],
      status: 'reviewing'
    };
    // 更新索引
    const idx = SENTENCE_LIBRARY.findIndex(s => s.id === sentenceId);
    if (idx >= state.libraryIndex) {
      state.libraryIndex = idx + 1;
    }
    saveState();
  }
}

// 复习结果
function recordReview(sentenceId, correct) {
  const s = state.sentences[sentenceId];
  if (!s) return;
  const today = getTodayStr();

  s.reviewLog.push({ date: today, result: correct ? 'correct' : 'wrong' });

  if (correct) {
    s.stage++;
    if (s.stage >= REVIEW_SCHEDULE.length) {
      s.status = 'mastered';
      s.nextReview = null;
    } else {
      s.nextReview = addDays(today, REVIEW_SCHEDULE[s.stage]);
      s.status = 'reviewing';
    }
  } else {
    s.stage = 0;
    s.nextReview = addDays(today, REVIEW_SCHEDULE[0]);
    s.status = 'reviewing';
  }

  saveState();
}

// 统计数据
function getStats() {
  let total = 0, reviewing = 0, mastered = 0;
  for (const id in state.sentences) {
    total++;
    if (state.sentences[id].status === 'mastered') mastered++;
    else reviewing++;
  }
  return { total, reviewing, mastered };
}

// ====== 音频播放 ======
const audio = document.getElementById('audioPlayer');
let currentAudioBtn = null;

function playAudio(src, btn) {
  if (!src) return;

  if (currentAudioBtn === btn && !audio.paused) {
    audio.pause();
    audio.currentTime = 0;
    setBtnPlaying(btn, false);
    currentAudioBtn = null;
    return;
  }

  if (currentAudioBtn) setBtnPlaying(currentAudioBtn, false);

  audio.src = src;
  audio.play().then(() => {
    setBtnPlaying(btn, true);
    currentAudioBtn = btn;
  }).catch(err => {
    console.error('播放失败', err);
  });
}

function setBtnPlaying(btn, playing) {
  if (!btn) return;
  const span = btn.querySelector('span');
  const svg = btn.querySelector('svg');
  if (playing) {
    btn.classList.add('is-playing');
    if (span) { btn._origText = span.textContent; span.textContent = '停止'; }
    if (svg) { btn._origSvg = svg.innerHTML; svg.innerHTML = '<rect x="6" y="6" width="12" height="12"/>'; }
  } else {
    btn.classList.remove('is-playing');
    if (span && btn._origText) span.textContent = btn._origText;
    if (svg && btn._origSvg) svg.innerHTML = btn._origSvg;
  }
}

audio.addEventListener('ended', () => {
  if (currentAudioBtn) {
    setBtnPlaying(currentAudioBtn, false);
    currentAudioBtn = null;
  }
});

function bindCardEvents() {
  document.querySelectorAll('.sentence-card').forEach(card => {
    const chips = card.querySelectorAll('.word-chip');
    const detail = card.querySelector('.word-detail');
    const detailWord = detail.querySelector('.detail-word');
    const detailPronun = detail.querySelector('.detail-pronun');
    const detailPos = detail.querySelector('.detail-pos');
    const detailMeaning = detail.querySelector('.detail-meaning');
    const morphBox = detail.querySelector('.detail-morph');
    const morphFlow = detail.querySelector('.morph-flow');
    const morphExplain = detail.querySelector('.morph-explain');
    const exKr = detail.querySelector('.detail-ex-kr');
    const exCn = detail.querySelector('.detail-ex-cn');
    const playWordBtn = detail.querySelector('.detail-word-play-btn');
    let activeAudio = null;

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const wasActive = chip.classList.contains('is-active');
        chips.forEach(c => c.classList.remove('is-active'));

        if (wasActive) {
          detail.classList.remove('is-visible');
          activeAudio = null;
        } else {
          chip.classList.add('is-active');
          detailWord.textContent = chip.dataset.word;
          detailPronun.textContent = chip.dataset.pronun;
          detailPos.textContent = chip.dataset.pos;
          detailMeaning.textContent = chip.dataset.meaning;
          exKr.textContent = chip.dataset.exKr;
          exCn.textContent = chip.dataset.exCn;
          activeAudio = chip.dataset.audio;

          // 变形解析
          const morphStr = chip.dataset.morph ? decodeURIComponent(chip.dataset.morph) : '';
          if (morphStr) {
            try {
              const morph = JSON.parse(morphStr);
              // 构建变形流程图: 基本形 → 部分1 + 部分2 + ... → 结果
              let flowHtml = `<span class="morph-base">${morph.base}</span>`;
              flowHtml += `<span class="morph-arrow">→</span>`;
              morph.parts.forEach((p, i) => {
                if (i > 0) flowHtml += ` <span style="color:var(--text-tertiary); font-size:11px;">+</span> `;
                flowHtml += `<span class="morph-suffix" title="${p.type}">${p.text}</span>`;
              });
              flowHtml += `<span class="morph-arrow">→</span>`;
              flowHtml += `<span class="morph-result">${morph.result}</span>`;
              morphFlow.innerHTML = flowHtml;
              morphExplain.textContent = morph.explain;
              morphBox.style.display = 'block';
            } catch(e) {
              morphBox.style.display = 'none';
            }
          } else {
            morphBox.style.display = 'none';
          }

          detail.classList.add('is-visible');
          playWordBtn.style.display = activeAudio ? 'inline-flex' : 'none';
        }
      });
    });

    playWordBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeAudio) playAudio(activeAudio, playWordBtn);
    });
  });
}

// ====== 版本与更新管理 ======
let latestVersion = null;
let lastCheckTime = null;

function compareVersions(v1, v2) {
  const a = v1.split('.').map(Number);
  const b = v2.split('.').map(Number);
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const va = a[i] || 0;
    const vb = b[i] || 0;
    if (va > vb) return 1;
    if (va < vb) return -1;
  }
  return 0;
}

async function checkUpdate(manual) {
  // 本地文件模式无法检查更新
  if (location.protocol === 'file:') {
    if (manual) alert('本地文件模式不支持在线检查更新。\n\n请将 App 部署到网上后使用此功能。');
    document.getElementById('latestVersion').textContent = '本地模式不支持';
    return;
  }

  if (manual) {
    const btn = event.currentTarget;
    if (btn) { btn.disabled = true; }
  }

  try {
    // 加时间戳防止缓存
    const res = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('无法获取版本信息');
    const data = await res.json();
    latestVersion = data.version;
    lastCheckTime = Date.now();

    document.getElementById('latestVersion').textContent = 'v' + latestVersion;

    if (compareVersions(latestVersion, APP_VERSION) > 0) {
      // 有新版本
      const banner = document.getElementById('updateBanner');
      document.getElementById('updateVerNum').textContent = 'v' + latestVersion;
      document.getElementById('updateDesc').textContent = data.desc || '';
      banner.classList.add('is-visible');

      if (manual) {
        showConfirm('发现新版本', `v${APP_VERSION} → v${latestVersion}\n\n${data.desc || ''}`, () => {
          applyUpdate();
        });
      }
    } else {
      if (manual) {
        alert('当前已是最新版本 v' + APP_VERSION);
      }
    }
  } catch(err) {
    console.error('检查更新失败:', err);
    document.getElementById('latestVersion').textContent = '检查失败';
    if (manual) alert('检查更新失败：' + err.message + '\n\n可能原因：\n1. 网络连接问题\n2. version.json 文件不存在\n3. 本地文件模式不支持');
  } finally {
    if (manual) {
      const btn = document.target;
      if (btn) { btn.disabled = false; }
    }
  }
}

function applyUpdate() {
  // 注销旧 Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(reg => reg.unregister());
    });
  }
  // 清空所有缓存
  if ('caches' in window) {
    caches.keys().then(keys => {
      keys.forEach(key => caches.delete(key));
    });
  }
  // 强制刷新页面（绕过缓存）
  setTimeout(() => {
    location.reload();
  }, 300);
}

// ====== PWA: Service Worker 注册 ======
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('Service Worker 注册成功:', reg.scope);

      // 监听 Service Worker 更新
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // 有新的 Service Worker 等待激活
            console.log('新版本已下载，刷新页面以更新');
          }
        });
      });
    }).catch(err => {
      console.log('Service Worker 注册失败（本地文件打开时正常）:', err);
    });
  });
}
</script>
</body>
</html>
