<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c7cf0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5856d6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0efff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- 打开的书本 -->
  <g transform="translate(128, 150)">
    <!-- 左页 -->
    <path d="M128 20 L128 180 Q128 200 108 200 L8 180 Q0 176 0 160 L0 40 Q0 24 8 20 L108 0 Q128 0 128 20 Z" fill="url(#book)" opacity="0.95"/>
    <!-- 右页 -->
    <path d="M128 20 L128 180 Q128 200 148 200 L248 180 Q256 176 256 160 L256 40 Q256 24 248 20 L148 0 Q128 0 128 20 Z" fill="url(#book)"/>

    <!-- 韩文 Hangul 文字（简化的 한글 样式） -->
    <g fill="#5856d6" opacity="0.7">
      <!-- 左页：ㄴ + ㅣ + ㅁ 组合 -->
      <text x="64" y="95" text-anchor="middle" font-size="42" font-family="sans-serif" font-weight="600">한</text>
      <text x="64" y="145" text-anchor="middle" font-size="36" font-family="sans-serif" font-weight="500">글</text>

      <!-- 右页：播放按钮 -->
      <circle cx="192" cy="110" r="38" fill="#5856d6" opacity="0.15"/>
      <path d="M178 90 L212 110 L178 130 Z" fill="#5856d6"/>
    </g>

    <!-- 书脊阴影 -->
    <rect x="124" y="0" width="8" height="200" fill="rgba(0,0,0,0.08)"/>
  </g>

  <!-- 底部装饰：小星点 -->
  <circle cx="100" cy="100" r="6" fill="white" opacity="0.4"/>
  <circle cx="420" cy="130" r="4" fill="white" opacity="0.3"/>
  <circle cx="400" cy="380" r="5" fill="white" opacity="0.35"/>
  <circle cx="90" cy="400" r="3" fill="white" opacity="0.3"/>
</svg>
